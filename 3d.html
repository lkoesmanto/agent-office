<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Office 3D · I didn't hire tools. I staffed roles.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .scene3d{position:relative;border-radius:22px;overflow:hidden;background:#F5F5F7;width:100%;aspect-ratio:1200/510;touch-action:none}
  .scene3d canvas{display:block;width:100%;height:100%;cursor:grab}
  .scene3d canvas:active{cursor:grabbing}
  .labels3d{position:absolute;inset:0;pointer-events:none}
  .labels3d .lab{display:flex;flex-direction:column;align-items:center;gap:3px;width:136px}
  .labels3d .np{display:inline-flex;align-items:center;gap:5px;max-width:100%;background:rgba(255,255,255,.96);border:1px solid var(--line);
      border-radius:7px;padding:2px 7px;font-size:11px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .3s,border-color .3s}
  .labels3d .np b{font-weight:700;letter-spacing:-0.02em}
  .labels3d .np span{color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis}
  .labels3d .np i{width:6px;height:6px;border-radius:50%;flex:none}
  .labels3d .lab.flash .np{border-color:#0071E3;box-shadow:0 0 0 2px rgba(0,113,227,.25)}
  .labels3d .cap{max-width:100%;background:rgba(255,255,255,.88);border-radius:8px;padding:2px 7px;font-size:10.5px;line-height:1.3;
      font-weight:500;color:var(--ink);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
      box-shadow:0 1px 3px rgba(0,0,0,.06);transition:opacity .35s,transform .35s}
  .labels3d .cap:empty{display:none}
  .hint3d{position:absolute;left:14px;bottom:10px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.8);
      padding:4px 10px;border-radius:999px;pointer-events:none;transition:opacity .6s}
  .gl-error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--muted);padding:20px}
  .gl-error a{color:var(--accent)}
  @media (max-width:900px){
    .scene3d{aspect-ratio:1/1}
    .labels3d .lab{width:120px}.labels3d .np{font-size:9.5px}.labels3d .cap{font-size:9px}
  }
  @media (max-width:600px){ .labels3d .cap{display:none} .labels3d .np span{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header id="officeHeader"></header>
  <div class="scene3d" id="scene3d"><div class="hint3d" id="hint3d">Drag to orbit · scroll to zoom</div></div>
  <section class="feed" id="officeFeed"></section>
  <footer id="officeFooter"></footer>
</div>
<script src="shared.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
/* 3D renderer (three.js r160). Data, controls and handoff queue live in shared.js (window.Office). */
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const O = window.Office;
O.mount("3d");
const { AGENTS, byId, hash, nowS, jakartaHour, fmtHM } = O;
const walkers = O.walkers;
const host = document.getElementById("scene3d");

/* ---------- renderer / camera ---------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); }
catch (e) { host.insertAdjacentHTML("beforeend", `<div class="gl-error">3D needs WebGL, which isn't available here.<br><a href="index.html${location.search}">Open the Pixel view</a></div>`); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.prepend(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.className = "labels3d";
host.appendChild(labelR.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#F5F5F7");
const camera = new THREE.PerspectiveCamera(22, 2.35, 0.5, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0.6);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 12; controls.maxDistance = 36;
controls.minPolarAngle = 0.45; controls.maxPolarAngle = 1.2;
controls.minAzimuthAngle = -0.45; controls.maxAzimuthAngle = 1.15;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.7;
const sph = new THREE.Spherical(23, 0.84, 0.0);
camera.position.setFromSpherical(sph).add(controls.target);
camera.lookAt(controls.target);

let lastInteract = -99, driftDir = 1;
controls.addEventListener("start", () => { lastInteract = nowS(); document.getElementById("hint3d").style.opacity = 0; });
controls.addEventListener("end", () => { lastInteract = nowS(); });

function resize() {
  const w = host.clientWidth, h = host.clientHeight || 1;
  renderer.setSize(w, h, false); labelR.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = THREE.MathUtils.clamp(2 * Math.atan(0.47 / (w / h)) * 180 / Math.PI, 20, 68);   // keep ~50° horizontal view
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host); resize();

/* ---------- lights (one shadow caster) ---------- */
const hemi = new THREE.HemisphereLight("#ffffff", "#e6e3ee", 2.0);
scene.add(hemi);
const key = new THREE.DirectionalLight("#ffffff", 2.4);
key.position.set(-7, 14, 9);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -10, right: 10, top: 9, bottom: -9, near: 2, far: 40 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 3;
scene.add(key);
const fill = new THREE.DirectionalLight("#dfe8ff", 0.6); fill.position.set(8, 6, 6); scene.add(fill);

/* ---------- helpers ---------- */
const matCache = {};
function mat(color, o = {}) {
  const k = color + JSON.stringify(o);
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...o }));
}
function mesh(geo, m, { x = 0, y = 0, z = 0, cast = true, recv = false, parent } = {}) {
  const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = cast; me.receiveShadow = recv;
  if (parent) parent.add(me); return me;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function canvasTex(w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return { c, g: c.getContext("2d"), t };
}
function lerpHex(a, b, t) { return "#" + new THREE.Color(a).lerp(new THREE.Color(b), t).getHexString(); }
function skyFor(h) {
  if (h >= 7 && h < 16.5) return { top: "#5AA9F2", bot: "#CFE8FF", city: "#B4C3D6", lit: 0, sun: 1, hemi: "#ffffff", key: "#fffaf0", ki: 2.4 };
  if (h >= 16.5 && h < 18.5) return { top: "#5B5FC7", bot: "#FFB07A", city: "#7A6A92", lit: .3, sun: 1, hemi: "#fff4ee", key: "#ffe6d2", ki: 2.2 };
  if (h >= 5 && h < 7) return { top: "#7FA6E8", bot: "#FFD3B0", city: "#8E9AB8", lit: .15, sun: 1, hemi: "#fff6f0", key: "#ffeedd", ki: 2.2 };
  return { top: "#0B1530", bot: "#2A3A66", city: "#18213D", lit: .6, sun: 0, hemi: "#d6dcff", key: "#fff1dc", ki: 1.6 };
}

/* ---------- room ---------- */
const ROOM = { x0: -8, x1: 8, z0: -4.5, z1: 5 };
scene.add(mesh(box(16, 0.2, 9.5), mat("#EEEBE6"), { y: -0.1, z: 0.25, cast: false, recv: true }));
scene.add(mesh(box(16.2, 4, 0.2), mat("#FAFAFC"), { y: 2, z: -4.6, cast: false, recv: true }));
scene.add(mesh(box(0.2, 4, 9.7), mat("#F7F7FA"), { x: -8.1, y: 2, z: 0.15, cast: false, recv: true }));
scene.add(mesh(box(16, 0.12, 0.04), mat("#E5E5EA"), { y: 0.06, z: -4.49, cast: false }));
scene.add(mesh(box(0.04, 0.12, 9.5), mat("#E5E5EA"), { x: -7.99, y: 0.06, z: 0.25, cast: false }));
// floor planks
for (let z = -4; z < 5; z += 0.9) scene.add(mesh(box(16, 0.002, 0.012), mat("#E4E0DA"), { y: 0.001, z, cast: false }));

// windows with Jakarta-time sky
const windows = [];
function makeWindow(cx, k) {
  const W = 4.0, H = 2.0, y = 2.35, z = -4.49;
  const tx = canvasTex(256, 128);
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map: tx.t, toneMapped: false }));
  sky.position.set(cx, y, z + 0.005); scene.add(sky);
  const fm = mat("#D2D2D7");
  [[0, H / 2 + 0.05, W + 0.2, 0.1], [0, -H / 2 - 0.05, W + 0.2, 0.1]].forEach(([dx, dy, w, h]) => scene.add(mesh(box(w, h, 0.08), fm, { x: cx + dx, y: y + dy, z: z + 0.03, cast: false })));
  [-W / 2 - 0.05, 0, W / 2 + 0.05].forEach(dx => scene.add(mesh(box(0.08, H + 0.2, 0.08), fm, { x: cx + dx, y, z: z + 0.03, cast: false })));
  scene.add(mesh(box(W, 0.04, 0.06), fm, { x: cx, y: y + 0.1, z: z + 0.03, cast: false }));
  scene.add(mesh(box(W + 0.4, 0.06, 0.25), mat("#FFFFFF"), { x: cx, y: y - H / 2 - 0.13, z: z + 0.12, cast: false }));
  // light patch on the floor
  const patch = new THREE.Mesh(new THREE.PlaneGeometry(W, 2.6), new THREE.MeshBasicMaterial({ color: "#FFE9A8", transparent: true, opacity: 0.18, depthWrite: false }));
  patch.rotation.x = -Math.PI / 2; patch.position.set(cx + 0.6, 0.003, z + 1.6); scene.add(patch);
  windows.push({ tx, k, patch, W, H });
}
makeWindow(-4.6, 0); makeWindow(1.4, 1);
function drawSky(win, t, hour) {
  const { g, c } = win.tx, w = c.width, h = c.height, s = skyFor(hour), k = win.k;
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, s.top); gr.addColorStop(1, s.bot);
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  if (s.sun) {
    if (k === 0) { const sx = 30 + ((hour - 5) / 14) * (w - 60); g.fillStyle = "rgba(255,226,122,.35)"; g.beginPath(); g.arc(sx, 30 + Math.abs(hour - 12) * 3, 18, 0, 7); g.fill();
      g.fillStyle = "#FFE27A"; g.beginPath(); g.arc(sx, 30 + Math.abs(hour - 12) * 3, 11, 0, 7); g.fill(); }
    g.fillStyle = "rgba(255,255,255,.9)";
    for (let i = 0; i < 4; i++) { const cx = ((t * 4 + i * 80 + k * 40) % (w + 80)) - 40, cy = 18 + i * 13;
      g.beginPath(); g.ellipse(cx, cy, 22, 6, 0, 0, 7); g.ellipse(cx + 10, cy - 4, 12, 6, 0, 0, 7); g.fill(); }
  } else {
    for (let i = 0; i < 40; i++) { g.fillStyle = Math.sin(t * 2 + i) > -0.3 ? "#fff" : "#8899BB"; g.fillRect(hash(i + k * 50) * w, hash(i * 7 + k) * h * .55, 2, 2); }
    if (k === 1) { g.fillStyle = "#F5F5F7"; g.beginPath(); g.arc(w - 50, 30, 12, 0, 7); g.fill(); g.fillStyle = s.top; g.beginPath(); g.arc(w - 45, 26, 10, 0, 7); g.fill(); }
  }
  let bx = 0;
  for (let i = 0; bx < w; i++) { const bw = 14 + Math.floor(hash(i + k * 31) * 22), bh = 22 + Math.floor(hash(i * 5 + k * 13) * 52);
    g.fillStyle = s.city; g.fillRect(bx, h - bh, bw, bh);
    if (s.lit) { g.fillStyle = "#FFE08A"; for (let wy = h - bh + 5; wy < h - 3; wy += 7) for (let wx = bx + 3; wx < bx + bw - 3; wx += 5) if (hash(wx * 7 + wy * 13) < s.lit) g.fillRect(wx, wy, 2, 3); }
    bx += bw + 3; }
  win.tx.t.needsUpdate = true;
  win.patch.visible = !!s.sun;
  win.patch.material.color.set(hour >= 16.5 ? "#FFC8A0" : "#FFE9A8");
}

// whiteboard (left wall)
{
  const tx = canvasTex(512, 300), g = tx.g;
  g.fillStyle = "#fff"; g.fillRect(0, 0, 512, 300);
  g.strokeStyle = "#0071E3"; g.lineWidth = 6; g.lineJoin = "round"; g.beginPath();
  [[40, 240], [110, 205], [170, 215], [240, 150], [300, 160], [360, 80]].forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  g.strokeStyle = "#A1A1A6"; g.lineWidth = 3; g.beginPath(); g.moveTo(40, 40); g.lineTo(40, 260); g.lineTo(380, 260); g.stroke();
  [["#FFE27A", 400, 40], ["#FFB3C7", 455, 40], ["#B3D7FF", 400, 110], ["#D8C2FF", 455, 110], ["#C8F2D0", 400, 180]].forEach(([c, x, y]) => {
    g.fillStyle = c; g.fillRect(x, y, 46, 46); g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(x + 6, y + 12, 30, 3); g.fillRect(x + 6, y + 22, 22, 3); });
  g.fillStyle = "#AF52DE"; g.fillRect(200, 268, 120, 5);
  const wb = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.9), new THREE.MeshStandardMaterial({ map: tx.t, roughness: 0.4 }));
  wb.rotation.y = Math.PI / 2; wb.position.set(-7.96, 2.1, -1.2); scene.add(wb);
  scene.add(mesh(box(0.05, 2.0, 3.3), mat("#C7C7CC"), { x: -7.99, y: 2.1, z: -1.2, cast: false }));
  scene.add(mesh(box(0.14, 0.05, 3.0), mat("#AEAEB2"), { x: -7.92, y: 1.12, z: -1.2, cast: false }));
}
// wall clock (back wall, between windows)
const clock = canvasTex(128, 128);
{
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.32, 28), new THREE.MeshBasicMaterial({ map: clock.t }));
  m.position.set(-1.6, 3.0, -4.48); scene.add(m);
}
function drawClock() {
  const g = clock.g; g.clearRect(0, 0, 128, 128);
  g.fillStyle = "#D2D2D7"; g.beginPath(); g.arc(64, 64, 64, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(64, 64, 56, 0, 7); g.fill();
  const [h, mi] = fmtHM.format(new Date()).split(":").map(Number);
  const hand = (a, l, c, w) => { g.strokeStyle = c; g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.moveTo(64, 64); g.lineTo(64 + Math.sin(a) * l, 64 - Math.cos(a) * l); g.stroke(); };
  hand(((h % 12) + mi / 60) / 12 * Math.PI * 2, 30, "#1D1D1F", 7); hand(mi / 60 * Math.PI * 2, 44, "#0071E3", 5);
  clock.t.needsUpdate = true;
}

// plants
const sway = [];
function plant(x, z, s = 1, y = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s);
  mesh(new THREE.CylinderGeometry(0.26, 0.2, 0.42, 8), mat("#E8DCCB"), { y: 0.21, parent: g });
  const leaves = new THREE.Group(); leaves.position.y = 0.42; g.add(leaves);
  const lg = new THREE.IcosahedronGeometry(0.28, 0), greens = ["#34C759", "#2FA84F", "#248A3D"];
  for (let i = 0; i < 7; i++) {
    const a = i * 2.4, r = i ? 0.18 : 0;
    const l = mesh(lg, mat(greens[i % 3], { flatShading: true }), { x: Math.cos(a) * r, y: 0.15 + i * 0.12, z: Math.sin(a) * r, parent: leaves });
    l.scale.set(1, 1.3, 1).multiplyScalar(1 - i * 0.07); l.rotation.set(a, a * 0.5, 0);
  }
  scene.add(g); sway.push({ leaves, ph: x * 1.3 + z }); return g;
}
plant(-7.4, -4.0, 1.3); plant(7.5, -3.0, 1.1); plant(-7.4, 4.4, 1.0); plant(-2.9, -4.1, 0.8);

// coffee station (back wall, right)
const steamSources = [];
{
  const g = new THREE.Group(); g.position.set(6.2, 0, -4.15); scene.add(g);
  mesh(box(2.6, 0.9, 0.6), mat("#E5E5EA"), { y: 0.45, parent: g });
  mesh(box(2.7, 0.05, 0.66), mat("#FFFFFF"), { y: 0.92, parent: g });
  mesh(box(0.5, 0.6, 0.4), mat("#2C2C2E"), { x: -0.6, y: 1.25, parent: g });
  mesh(box(0.36, 0.14, 0.02), mat("#48484A"), { x: -0.6, y: 1.42, z: 0.21, parent: g });
  const led = mesh(new THREE.SphereGeometry(0.025, 8, 6), new THREE.MeshBasicMaterial({ color: "#30D158" }), { x: -0.45, y: 1.42, z: 0.225, parent: g, cast: false });
  g.userData.led = led;
  mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.09, 10), mat("#FFFFFF"), { x: -0.6, y: 1.0, z: 0.1, parent: g });
  mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.3, 10), mat("#D2D2D7", { roughness: 0.3 }), { x: 0.3, y: 1.1, parent: g });
  mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.11, 10), mat("#FFFFFF"), { x: 0.75, y: 1.0, z: 0.05, parent: g });
  mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.11, 10), mat("#0071E3"), { x: 0.92, y: 1.0, z: 0.05, parent: g });
  steamSources.push({ obj: g, off: new THREE.Vector3(-0.6, 1.08, 0.1), always: true });
  window.__coffee = g;
}

// lounge (row 2, right)
{
  const g = new THREE.Group(); g.position.set(6.3, 0, 2.3); scene.add(g);
  mesh(new THREE.CylinderGeometry(1.35, 1.35, 0.02, 28), mat("#E5E5EA"), { y: 0.01, parent: g, cast: false, recv: true });
  const sofa = mat("#C9CCE8");
  mesh(box(1.8, 0.4, 0.75), sofa, { y: 0.3, z: 0.4, parent: g });
  mesh(box(1.8, 0.55, 0.18), sofa, { y: 0.65, z: 0.72, parent: g });
  mesh(box(0.18, 0.55, 0.75), sofa, { x: -0.9, y: 0.45, z: 0.4, parent: g });
  mesh(box(0.18, 0.55, 0.75), sofa, { x: 0.9, y: 0.45, z: 0.4, parent: g });
  mesh(box(0.42, 0.32, 0.12), mat("#0071E3"), { x: -0.5, y: 0.66, z: 0.58, parent: g }).rotation.z = 0.1;
  mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.04, 20), mat("#FFFFFF"), { y: 0.42, z: -0.55, parent: g });
  mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4, 8), mat("#C7C7CC"), { y: 0.2, z: -0.55, parent: g });
  mesh(box(0.25, 0.04, 0.18), mat("#FF9F0A"), { x: 0.08, y: 0.46, z: -0.55, parent: g });
  plant(7.5, 1.4, 1.0);
}

/* ---------- shared textures ---------- */
function bubbleTex(kind, act) {
  const { g, t } = canvasTex(128, 104);
  g.fillStyle = "rgba(0,0,0,.08)";
  g.fillStyle = "#fff"; g.strokeStyle = "#D2D2D7"; g.lineWidth = 3;
  g.beginPath(); g.ellipse(64, 40, 56, 34, 0, 0, 7); g.fill(); g.stroke();
  g.beginPath(); g.arc(30, 86, 9, 0, 7); g.fill(); g.stroke();
  g.beginPath(); g.arc(16, 99, 5, 0, 7); g.fill(); g.stroke();
  if (kind === "dots") { for (let i = 0; i < 3; i++) { g.fillStyle = "#8E44EF"; g.beginPath(); g.arc(40 + i * 24, 42 - (i === act ? 6 : 0), 8, 0, 7); g.fill(); } }
  else { g.fillStyle = "#FFD60A"; g.beginPath(); g.arc(64, 34, 18, 0, 7); g.fill(); g.fillStyle = "#8E8E93"; g.fillRect(56, 50, 16, 12);
    g.strokeStyle = "#FFD60A"; g.lineWidth = 4; [[-34, -8], [34, -8], [-26, -26], [26, -26]].forEach(([dx, dy]) => { g.beginPath(); g.moveTo(64 + dx * .8, 34 + dy * .8); g.lineTo(64 + dx, 34 + dy); g.stroke(); }); }
  return t;
}
const BUBBLE = [bubbleTex("dots", 0), bubbleTex("dots", 1), bubbleTex("dots", 2), bubbleTex("bulb")];
const STEAM = (() => { const { g, t } = canvasTex(64, 64); const r = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  r.addColorStop(0, "rgba(255,255,255,.95)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return t; })();
const CHECK = (() => { const { g, t } = canvasTex(64, 64); g.fillStyle = "#30D158"; g.beginPath(); g.arc(32, 32, 28, 0, 7); g.fill();
  g.strokeStyle = "#fff"; g.lineWidth = 7; g.lineCap = "round"; g.beginPath(); g.moveTo(19, 33); g.lineTo(28, 42); g.lineTo(46, 23); g.stroke(); return t; })();

// steam particle pool
const steam = [];
for (let i = 0; i < 60; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: STEAM, transparent: true, depthWrite: false, opacity: 0 }));
  s.scale.setScalar(0.12); s.visible = false; scene.add(s); steam.push({ s, life: 0, max: 1 });
}
let steamIdx = 0;
function puff(pos) {
  const p = steam[steamIdx++ % steam.length]; p.s.position.copy(pos); p.life = 0; p.max = 1.2 + Math.random() * 0.6;
  p.vx = (Math.random() - .5) * 0.05; p.s.visible = true;
}

/* ---------- desks + people ---------- */
const XS = [-6, -4, -2, 0, 2, 4, 6], ROWZ = [-1.6, 1.9], AISLE = 0.55, SEAT = 0.62, SPEED = 1.5;

function buildPerson(a) {

AGENTS.forEach((a, i) => {

  a.scrM = scrM;
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.5), new THREE.MeshBasicMaterial({ color: "#64A8FF", transparent: true, opacity: 0.0, depthWrite: false, blending: THREE.AdditiveBlending }));

  mesh(box(0.5, 0.03, 0.06), mat("#8E8E93"), { y: 0.03, parent: ch }); mesh(box(0.06, 0.03, 0.5), mat("#8E8E93"), { y: 0.03, parent: ch });

/* ---------- handoffs ---------- */
function exitPath(a) { return a.row === 0 ? [{ x: a.x, z: a.seatZ + 0.55 }, { x: a.x, z: AISLE }] : [{ x: a.x, z: a.seatZ + 0.55 }, { x: a.x + 1, z: a.seatZ + 0.55 }, { x: a.x + 1, z: AISLE }]; }

function startQueued() {

    const a = byId[h.from], b = byId[h.to];
    const path = [{ x: a.x, z: a.seatZ }, ...exitPath(a), ...approachPath(b)];
    O.beginWalk({ ...h, path, pts: path, i: 0, x: a.x, z: a.seatZ, phase: "go", giveT: 0, moving: false, walkT: 0 });

const fly = new THREE.Mesh(G.folder, mat("#0071E3")); fly.castShadow = true; fly.visible = false; scene.add(fly);
const flies = [];
function stepWalker(w, dt) {
  const a = byId[w.from];
  if (w.phase === "give") {
    w.moving = false; w.giveT += dt;
    if (w.giveT >= 1.5) { w.phase = "back"; w.pts = w.path.slice().reverse(); w.i = 0; O.deliver(w); }
    return;

  const tgt = w.pts[w.i + 1];
  if (!tgt) { if (w.phase === "go") { w.phase = "give"; w.giveT = 0; } else O.endWalk(w); return; }

  w.moving = true; w.walkT += dt; w.yaw = Math.atan2(-dx, -dz);
  if (d <= s) { w.x = tgt.x; w.z = tgt.z; w.i++; } else { w.x += dx / d * s; w.z += dz / d * s; }
}

/* ---------- posing ---------- */
const damp = (cur, tgt, k, dt) => cur + (tgt - cur) * (1 - Math.exp(-k * dt));

      bob = Math.max(0, Math.sin(r)) * 0.02;

  } else if (!w) {
    if (st === "working") {
      const k = t * 14 + ph * 3;
      Object.assign(tg, { tX: -0.12, hX: -0.12, sLx: 0.62, sLz: 0.1, sRx: 0.62, sRz: -0.1, eL: 1.05 + Math.max(0, Math.sin(k)) * 0.22, eR: 1.05 + Math.max(0, Math.sin(k + 2.1)) * 0.22 });
    } else if (st === "thinking") {
      Object.assign(tg, { tX: -0.04, hX: 0.05, hZ: Math.sin(t * 0.9 + ph) * 0.2, sLx: 0.5, sLz: 0.1, eL: 0.9, sRx: 0.55, sRz: -0.45, eR: 2.35 + Math.sin(t * 2 + ph) * 0.05 });

      else { Object.assign(tg, { tX: 0.22, hX: sip ? 0.15 : 0.05, sLx: 0.15, sLz: 0.12, eL: 0.35, sRx: sip ? 0.75 : 0.45, sRz: -0.2, eR: sip ? 2.25 : 1.55 }); mugOn = true; }

      fly.visible = true; fly.position.lerpVectors(tmpV, end, k); fly.position.y += Math.sin(k * Math.PI) * 0.15; fly.rotation.set(-Math.PI / 2 * k, 0.3 * k, 0);

/* ---------- loop ---------- */
let last = nowS(), lastScreens = 0, lastSky = -9, lastClock = -99;
function frame() {

    p.s.position.y += dt * 0.28; p.s.position.x += p.vx * dt; p.s.material.opacity = 0.55 * (1 - k); p.s.scale.setScalar(0.08 + k * 0.14); });

    sph.theta += driftDir * 0.02 * dt;

drawClock();
requestAnimationFrame(frame);
