<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Office 3D · I didn't hire tools. I staffed roles.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=202610171757">
<style>
  .scene3d{position:relative;border-radius:22px;overflow:hidden;background:#F5F5F7;width:100%;aspect-ratio:1200/528;touch-action:none}
  .scene3d canvas{display:block;width:100%;height:100%;cursor:grab}
  .scene3d canvas:active{cursor:grabbing}
  .labels3d{position:absolute;inset:0;pointer-events:none}
  .labels3d .lab{display:flex;flex-direction:column;align-items:center;gap:2px;width:172px}
  .labels3d .np{display:inline-flex;align-items:center;gap:5px;max-width:100%;background:rgba(255,255,255,.96);border:1px solid var(--line);
      border-radius:7px;padding:2px 7px;font-size:11px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .3s,border-color .3s}
  .labels3d .np b{font-weight:700;letter-spacing:-0.02em}
  .labels3d .np span{color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis}
  .labels3d .np i{width:6px;height:6px;border-radius:50%;flex:none}
  .labels3d .lab.flash .np{border-color:#0071E3;box-shadow:0 0 0 2px rgba(0,113,227,.25)}
  .labels3d .cap{max-width:100%;background:rgba(255,255,255,.88);border-radius:8px;padding:2px 7px;font-size:10.5px;line-height:1.3;
      font-weight:500;color:var(--ink);text-align:center;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;
      box-shadow:0 1px 3px rgba(0,0,0,.06);transition:opacity .35s,transform .35s}
  .labels3d .cap:empty{display:none}
  .labels3d .lab.boss{width:240px}
  .labels3d .lab.boss .np{font-size:13px;padding:3px 10px;border:1.5px solid #C9A44C;box-shadow:0 2px 10px rgba(201,164,76,.35)}
  .labels3d .lab.boss .cap{font-size:11.5px}
  .labels3d .np .star{font-style:normal;color:#fff;background:linear-gradient(135deg,#E7C66F,#B8892E);width:16px;height:16px;border-radius:50%;
      display:inline-grid;place-items:center;font-size:10px;line-height:1;flex:none}
  .hint3d{position:absolute;left:14px;bottom:10px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.8);
      padding:4px 10px;border-radius:999px;pointer-events:none;transition:opacity .6s}
  .gl-error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--muted);padding:20px}
  .gl-error a{color:var(--accent)}
  @media (max-width:900px){
    .scene3d{aspect-ratio:1/1}
    .labels3d .lab{width:120px}.labels3d .np{font-size:9.5px}.labels3d .cap{font-size:9px}
  }
  @media (max-width:600px){ .labels3d .cap{display:none} .labels3d .np span{display:none} }
</style>
</head>

<div class="wrap">

</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
/* 3D renderer (three.js r160). Data, controls and handoff queue live in shared.js (window.Office). */
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const O = window.Office;
O.mount("3d");
const { AGENTS, byId, hash, nowS, jakartaHour, fmtHM } = O;
const walkers = O.walkers;
const host = document.getElementById("scene3d");

/* ---------- renderer / camera ---------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); }
catch (e) { host.insertAdjacentHTML("beforeend", `<div class="gl-error">3D needs WebGL, which isn't available here.<br><a href="index.html${location.search}">Open the Pixel view</a></div>`); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.prepend(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.className = "labels3d";
host.appendChild(labelR.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#F5F5F7");
const camera = new THREE.PerspectiveCamera(24, 2.2, 0.5, 140);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.3, 2.85, 0.3);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 13; controls.maxDistance = 38;
controls.minPolarAngle = 0.75; controls.maxPolarAngle = 1.42;
controls.minAzimuthAngle = -0.55; controls.maxAzimuthAngle = 0.9;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.7;
const sph = new THREE.Spherical(22.5, 1.24, 0.04);
camera.position.setFromSpherical(sph).add(controls.target);
camera.lookAt(controls.target);

let lastInteract = -99, driftDir = 1;
controls.addEventListener("start", () => { lastInteract = nowS(); document.getElementById("hint3d").style.opacity = 0; });
controls.addEventListener("end", () => { lastInteract = nowS(); });

function resize() {
  const w = host.clientWidth, h = host.clientHeight || 1;
  renderer.setSize(w, h, false); labelR.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = THREE.MathUtils.clamp(2 * Math.atan(0.5 / (w / h)) * 180 / Math.PI, 20, 70);   // ~53° horizontal view
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host); resize();

/* ---------- lights (one shadow caster) ---------- */
const hemi = new THREE.HemisphereLight("#ffffff", "#e6e3ee", 2.1);
scene.add(hemi);
const key = new THREE.DirectionalLight("#ffffff", 2.4);
key.position.set(-8, 16, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -13, right: 13, top: 12, bottom: -12, near: 2, far: 50 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 3;
scene.add(key);
const fill = new THREE.DirectionalLight("#dfe8ff", 0.6); fill.position.set(8, 6, 6); scene.add(fill);

/* ---------- helpers ---------- */
const matCache = {};
function mat(color, o = {}) {
  const k = color + JSON.stringify(o);
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...o }));
}
function mesh(geo, m, { x = 0, y = 0, z = 0, cast = true, recv = false, parent } = {}) {
  const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = cast; me.receiveShadow = recv;
  if (parent) parent.add(me); return me;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function canvasTex(w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return { c, g: c.getContext("2d"), t };
}
function lerpHex(a, b, t) { return "#" + new THREE.Color(a).lerp(new THREE.Color(b), t).getHexString(); }
function skyFor(h) {
  if (h >= 7 && h < 16.5) return { top: "#5AA9F2", bot: "#CFE8FF", city: "#B4C3D6", lit: 0, sun: 1, hemi: "#ffffff", key: "#fffaf0", ki: 2.4 };
  if (h >= 16.5 && h < 18.5) return { top: "#5B5FC7", bot: "#FFB07A", city: "#7A6A92", lit: .3, sun: 1, hemi: "#fff4ee", key: "#ffe6d2", ki: 2.2 };
  if (h >= 5 && h < 7) return { top: "#7FA6E8", bot: "#FFD3B0", city: "#8E9AB8", lit: .15, sun: 1, hemi: "#fff6f0", key: "#ffeedd", ki: 2.2 };
  return { top: "#0B1530", bot: "#2A3A66", city: "#18213D", lit: .6, sun: 0, hemi: "#d6dcff", key: "#fff1dc", ki: 1.6 };
}

/* ---------- layout ---------- */
const FY = [0, 3.6];                         // floor heights: 0 = operations (ground), 1 = executive (upper)
const AISLE = [0.6, -1.35], SEAT = 0.62, SPEED = 2.0;
const STAIR = { x: 6.7, x0: 5.8, x1: 7.6, zBot: 3.2, zTop: -1.9 };
// [id, floor, deskX, deskZ, row]  (row 0 = back row, 1 = front row)
const LAYOUT = {
  waktu: [0, -5.5, -1.2, 0], willow: [0, -3.0, -1.2, 0], lake: [0, -0.5, -1.2, 0], luke: [0, 2.0, -1.2, 0],
  alx: [0, -4.25, 2.0, 1], kate: [0, -1.75, 2.0, 1], coach: [0, 0.75, 2.0, 1],
  atlas: [1, -2.4, -2.9, 0], wish: [1, 0.1, -2.9, 0], brin: [1, 2.6, -2.9, 0],
  altmodei: [1, -1.15, -0.5, 1], ote2: [1, 1.35, -0.5, 1],
};
// ground aisle -> stairs -> upper aisle
const CONN = [[5.2, 0, AISLE[0]], [5.2, 0, 3.7], [STAIR.x, 0, 3.7], [STAIR.x, 0, STAIR.zBot], [STAIR.x, FY[1], STAIR.zTop],
              [STAIR.x, FY[1], -2.6], [5.2, FY[1], -2.6], [5.2, FY[1], AISLE[1]]].map(([x, y, z]) => ({ x, y, z }));

/* ---------- room: two-storey cutaway ---------- */
const WALL = mat("#FAFAFC"), WALL2 = mat("#F7F7FA");
scene.add(mesh(box(16.4, 0.2, 9.4), mat("#EEEBE6"), { y: -0.1, z: 0, cast: false, recv: true }));
for (let z = -4.2; z < 4.6; z += 0.9) scene.add(mesh(box(16, 0.002, 0.012), mat("#E4E0DA"), { y: 0.001, z, cast: false }));
scene.add(mesh(box(16.4, 7.2, 0.2), WALL, { y: 3.6, z: -4.7, cast: false, recv: true }));
scene.add(mesh(box(0.2, 7.2, 9.4), WALL2, { x: -8.2, y: 3.6, z: 0, cast: false, recv: true }));
scene.add(mesh(box(16, 0.12, 0.04), mat("#E5E5EA"), { y: 0.06, z: -4.59, cast: false }));
scene.add(mesh(box(16, 0.12, 0.04), mat("#E5E5EA"), { y: FY[1] + 0.06, z: -4.59, cast: false }));
// upper slab (doesn't cast shadow so the ground floor stays bright) + landing; stair opening between them
const SLAB = mat("#F2EFEA"), EDGE = mat("#FFFFFF");
scene.add(mesh(box(13.8, 0.26, 5.5), SLAB, { x: -1.3, y: FY[1] - 0.13, z: -1.75, cast: false, recv: true }));
scene.add(mesh(box(2.6, 0.26, 2.8), SLAB, { x: 6.9, y: FY[1] - 0.13, z: -3.2, cast: false, recv: true }));
scene.add(mesh(box(13.8, 0.27, 0.06), EDGE, { x: -1.3, y: FY[1] - 0.13, z: 1.0, cast: false }));
for (let z = -4.2; z < 1.0; z += 0.9) scene.add(mesh(box(13.6, 0.002, 0.012), mat("#E7E2DC"), { x: -1.3, y: FY[1] + 0.001, z, cast: false }));
// ceiling light panels under the slab
const PANEL = new THREE.MeshBasicMaterial({ color: "#FFF8EC" });
[[-5.2, -2.8], [-2.0, -2.8], [1.2, -2.8], [-5.2, -0.4], [-2.0, -0.4], [1.2, -0.4], [4.2, -2.8], [4.2, -0.4]].forEach(([x, z]) =>
  scene.add(mesh(box(1.4, 0.03, 0.5), PANEL, { x, y: FY[1] - 0.275, z, cast: false })));

// glass railings
const GLASS = new THREE.MeshStandardMaterial({ color: "#BFE0FF", transparent: true, opacity: 0.22, roughness: 0.1, depthWrite: false });
const RAIL = mat("#C7C7CC", { roughness: 0.35, metalness: 0.4 });
function railX(x0, x1, z, y) { // along x
  const w = x1 - x0, cx = (x0 + x1) / 2;
  scene.add(mesh(box(w, 0.95, 0.02), GLASS, { x: cx, y: y + 0.5, z, cast: false }));
  scene.add(mesh(box(w, 0.05, 0.06), RAIL, { x: cx, y: y + 1.0, z, cast: false }));
  for (let x = x0; x <= x1 + 0.01; x += 1.7) scene.add(mesh(box(0.04, 1.0, 0.04), RAIL, { x, y: y + 0.5, z, cast: false }));
}
function railZ(z0, z1, x, y) { // along z
  const d = z1 - z0, cz = (z0 + z1) / 2;
  scene.add(mesh(box(0.02, 0.95, d), GLASS, { x, y: y + 0.5, z: cz, cast: false }));
  scene.add(mesh(box(0.06, 0.05, d), RAIL, { x, y: y + 1.0, z: cz, cast: false }));
  for (let z = z0; z <= z1 + 0.01; z += 1.3) scene.add(mesh(box(0.04, 1.0, 0.04), RAIL, { x, y: y + 0.5, z, cast: false }));
}
railX(-8.1, 5.6, 1.0, FY[1]);                 // upper front edge
railZ(STAIR.zTop, 1.0, 5.6, FY[1]);           // stair opening (upper side)
railZ(-4.5, STAIR.zTop, 8.15, FY[1]);         // landing edge
// staircase: open-riser steps + stringers + sloped glass
{
  const n = 17, rise = FY[1] / n, run = (STAIR.zBot - STAIR.zTop) / n, W = STAIR.x1 - STAIR.x0;
  const stepM = mat("#E9DFD2");
  for (let i = 0; i < n; i++) scene.add(mesh(box(W, 0.06, run + 0.04), stepM, { x: STAIR.x, y: (i + 1) * rise - 0.03, z: STAIR.zBot - (i + 0.5) * run }));
  const len = Math.hypot(FY[1], STAIR.zBot - STAIR.zTop), ang = Math.atan2(FY[1], STAIR.zBot - STAIR.zTop);
  const cz = (STAIR.zBot + STAIR.zTop) / 2, cy = FY[1] / 2;
  [STAIR.x0, STAIR.x1].forEach(x => {
    const s = mesh(box(0.06, 0.28, len), mat("#D2D2D7"), { x, y: cy, z: cz }); s.rotation.x = ang; scene.add(s);
    const g = mesh(box(0.02, 0.85, len), GLASS, { x, y: cy + 0.55, z: cz, cast: false }); g.rotation.x = ang; scene.add(g);
    const h = mesh(box(0.05, 0.05, len), RAIL, { x, y: cy + 1.0, z: cz, cast: false }); h.rotation.x = ang; scene.add(h);
  });
}

// windows (Jakarta-time sky) on both floors
const windows = [];
function makeWindow(cx, cy, W, H, k, { wallX = null, patch = true, floorY = 0 } = {}) {
  const tx = canvasTex(256, 128), g = new THREE.Group();
  if (wallX !== null) { g.position.set(wallX + 0.11, cy, cx); g.rotation.y = Math.PI / 2; } else g.position.set(cx, cy, -4.59);
  scene.add(g);
  mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map: tx.t, toneMapped: false }), { z: 0.005, parent: g, cast: false });
  const fm = mat("#D2D2D7");
  [H / 2 + 0.05, -H / 2 - 0.05].forEach(dy => mesh(box(W + 0.2, 0.1, 0.08), fm, { y: dy, z: 0.03, parent: g, cast: false }));
  [-W / 2 - 0.05, 0, W / 2 + 0.05].forEach(dx => mesh(box(0.08, H + 0.2, 0.08), fm, { x: dx, z: 0.03, parent: g, cast: false }));
  mesh(box(W + 0.4, 0.06, 0.25), mat("#FFFFFF"), { y: -H / 2 - 0.13, z: 0.12, parent: g, cast: false });
  let pm = null;
  if (patch) { pm = new THREE.Mesh(new THREE.PlaneGeometry(W, 2.4), new THREE.MeshBasicMaterial({ color: "#FFE9A8", transparent: true, opacity: 0.16, depthWrite: false }));
    pm.rotation.x = -Math.PI / 2; pm.position.set(cx + 0.5, floorY + 0.004, -3.2); scene.add(pm); }
  windows.push({ tx, k, patch: pm || { visible: false, material: { color: { set() {} } } } });
}
makeWindow(-4.5, 1.95, 3.6, 1.7, 0);
makeWindow(1.0, 1.95, 3.6, 1.7, 1);
makeWindow(-5.9, FY[1] + 1.95, 3.4, 1.7, 2, { floorY: FY[1] });          // behind the boss desk
makeWindow(1.2, FY[1] + 1.95, 3.6, 1.7, 3, { floorY: FY[1] });
makeWindow(-1.9, FY[1] + 1.95, 2.6, 1.7, 4, { wallX: -8.2, patch: false }); // corner window (left wall, exec floor)
function drawSky(win, t, hour) {
  const { g, c } = win.tx, w = c.width, h = c.height, s = skyFor(hour), k = win.k;
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, s.top); gr.addColorStop(1, s.bot);
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  if (s.sun) {
    if (k === 0) { const sx = 30 + ((hour - 5) / 14) * (w - 60); g.fillStyle = "rgba(255,226,122,.35)"; g.beginPath(); g.arc(sx, 30 + Math.abs(hour - 12) * 3, 18, 0, 7); g.fill();
      g.fillStyle = "#FFE27A"; g.beginPath(); g.arc(sx, 30 + Math.abs(hour - 12) * 3, 11, 0, 7); g.fill(); }
    g.fillStyle = "rgba(255,255,255,.9)";
    for (let i = 0; i < 4; i++) { const cx = ((t * 4 + i * 80 + k * 40) % (w + 80)) - 40, cy = 18 + i * 13;
      g.beginPath(); g.ellipse(cx, cy, 22, 6, 0, 0, 7); g.ellipse(cx + 10, cy - 4, 12, 6, 0, 0, 7); g.fill(); }
  } else {
    for (let i = 0; i < 40; i++) { g.fillStyle = Math.sin(t * 2 + i) > -0.3 ? "#fff" : "#8899BB"; g.fillRect(hash(i + k * 50) * w, hash(i * 7 + k) * h * .55, 2, 2); }
    if (k === 1) { g.fillStyle = "#F5F5F7"; g.beginPath(); g.arc(w - 50, 30, 12, 0, 7); g.fill(); g.fillStyle = s.top; g.beginPath(); g.arc(w - 45, 26, 10, 0, 7); g.fill(); }
  }
  let bx = 0;
  for (let i = 0; bx < w; i++) { const bw = 14 + Math.floor(hash(i + k * 31) * 22), bh = 22 + Math.floor(hash(i * 5 + k * 13) * 52);
    g.fillStyle = s.city; g.fillRect(bx, h - bh, bw, bh);
    if (s.lit) { g.fillStyle = "#FFE08A"; for (let wy = h - bh + 5; wy < h - 3; wy += 7) for (let wx = bx + 3; wx < bx + bw - 3; wx += 5) if (hash(wx * 7 + wy * 13) < s.lit) g.fillRect(wx, wy, 2, 3); }
    bx += bw + 3; }
  win.tx.t.needsUpdate = true;
  win.patch.visible = !!s.sun;
  win.patch.material.color.set(hour >= 16.5 ? "#FFC8A0" : "#FFE9A8");
}

// whiteboard (left wall)
{
  const tx = canvasTex(512, 300), g = tx.g;
  g.fillStyle = "#fff"; g.fillRect(0, 0, 512, 300);
  g.strokeStyle = "#0071E3"; g.lineWidth = 6; g.lineJoin = "round"; g.beginPath();
  [[40, 240], [110, 205], [170, 215], [240, 150], [300, 160], [360, 80]].forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  g.strokeStyle = "#A1A1A6"; g.lineWidth = 3; g.beginPath(); g.moveTo(40, 40); g.lineTo(40, 260); g.lineTo(380, 260); g.stroke();
  [["#FFE27A", 400, 40], ["#FFB3C7", 455, 40], ["#B3D7FF", 400, 110], ["#D8C2FF", 455, 110], ["#C8F2D0", 400, 180]].forEach(([c, x, y]) => {
    g.fillStyle = c; g.fillRect(x, y, 46, 46); g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(x + 6, y + 12, 30, 3); g.fillRect(x + 6, y + 22, 22, 3); });
  g.fillStyle = "#AF52DE"; g.fillRect(200, 268, 120, 5);
  const wb = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.9), new THREE.MeshStandardMaterial({ map: tx.t, roughness: 0.4 }));
  wb.rotation.y = Math.PI / 2; wb.position.set(-8.06, 1.9, 0.6); scene.add(wb);
  scene.add(mesh(box(0.05, 2.0, 3.3), mat("#C7C7CC"), { x: -8.09, y: 1.9, z: 0.6, cast: false }));
  scene.add(mesh(box(0.14, 0.05, 3.0), mat("#AEAEB2"), { x: -8.02, y: 0.92, z: 0.6, cast: false }));
}

const clock = canvasTex(128, 128);
{
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.32, 28), new THREE.MeshBasicMaterial({ map: clock.t }));
  m.position.set(-1.75, 2.75, -4.58); scene.add(m);
}
function drawClock() {
  const g = clock.g; g.clearRect(0, 0, 128, 128);
  g.fillStyle = "#D2D2D7"; g.beginPath(); g.arc(64, 64, 64, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(64, 64, 56, 0, 7); g.fill();
  const [h, mi] = fmtHM.format(new Date()).split(":").map(Number);
  const hand = (a, l, c, w) => { g.strokeStyle = c; g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.moveTo(64, 64); g.lineTo(64 + Math.sin(a) * l, 64 - Math.cos(a) * l); g.stroke(); };
  hand(((h % 12) + mi / 60) / 12 * Math.PI * 2, 30, "#1D1D1F", 7); hand(mi / 60 * Math.PI * 2, 44, "#0071E3", 5);
  clock.t.needsUpdate = true;
}

const sway = [];
function plant(x, z, s = 1, y = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s);

                       : [{ x: dx, y: fy, z: sz + 0.5 }, { x: dx + 1.25, y: fy, z: sz + 0.5 }, { x: dx + 1.25, y: fy, z: ai }];
    a.approach = row === 0 ? [{ x: dx + 0.7, y: fy, z: ai }, { x: dx + 0.7, y: fy, z: sz - 0.05 }]
                           : [{ x: dx + 1.25, y: fy, z: ai }, { x: dx + 1.25, y: fy, z: sz - 0.05 }, { x: dx + 0.7, y: fy, z: sz - 0.05 }];
    standardDesk(a);
  }
  a.P = buildPerson(a);
  a.P.root.position.set(a.sx, a.fy, a.sz);
  a.yaw = a.face; a.P.root.rotation.y = a.face;
  if (a.boss) {
    a.el.classList.add("boss");
    a.el.querySelector(".np").insertAdjacentHTML("afterbegin", '<em class="star" aria-hidden="true">★</em>');
  }
});

// group stretch spots: a row across the open front of the ground floor
AGENTS.forEach((a, i) => { a.groupAt = { x: -7.3 + i * 0.8, z: 3.75 + (i % 2) * 0.45 }; });

/* ---------- handoffs (cross-floor walks take the stairs) ---------- */
function buildPath(a, b) {
  const p = [{ x: a.sx, y: a.fy, z: a.sz }, ...a.exit];
  if (a.floor !== b.floor) p.push(...(a.floor === 0 ? CONN : CONN.slice().reverse()));
  p.push(...b.approach);
  return p;
}
function startQueued() {
  let h;
  while ((h = O.nextHandoff())) {
    const a = byId[h.from], b = byId[h.to], path = buildPath(a, b);
    O.beginWalk({ ...h, path, pts: path, i: 0, x: a.sx, y: a.fy, z: a.sz, phase: "go", giveT: 0, moving: false, walkT: 0 });
  }
}
const fly = new THREE.Mesh(G.folder, mat("#0071E3")); fly.castShadow = true; fly.visible = false; scene.add(fly);
function stepWalker(w, dt) {
  if (w.phase === "give") {
    w.moving = false; w.giveT += dt;
    if (w.giveT >= 1.5) { w.phase = "back"; w.pts = w.path.slice().reverse(); w.i = 0; O.deliver(w); }
    return;
  }
  const tgt = w.pts[w.i + 1];
  if (!tgt) { if (w.phase === "go") { w.phase = "give"; w.giveT = 0; } else O.endWalk(w); return; }
  const dx = tgt.x - w.x, dy = tgt.y - w.y, dz = tgt.z - w.z, d = Math.hypot(dx, dy, dz), s = SPEED * dt;
  w.moving = true; w.walkT += dt;
  if (Math.hypot(dx, dz) > 1e-4) w.yaw = Math.atan2(-dx, -dz);
  if (d <= s) { w.x = tgt.x; w.y = tgt.y; w.z = tgt.z; w.i++; } else { w.x += dx / d * s; w.y += dy / d * s; w.z += dz / d * s; }
}

/* ---------- posing ---------- */
const damp = (cur, tgt, k, dt) => cur + (tgt - cur) * (1 - Math.exp(-k * dt));
function angDamp(cur, tgt, k, dt) { let d = tgt - cur; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return cur + d * (1 - Math.exp(-k * dt)); }
const tmpV = new THREE.Vector3(), endV = new THREE.Vector3();
function poseAgent(a, t, dt) {
  const P = a.P, w = a.walker, ph = a.phase, st = O.effState(a);
  let mugOn = false, folderOn = false, bubbleOn = false;
  const tg = { hipY: 0.5, tX: 0, tZ: 0, hX: 0, hZ: 0, sLx: 0.1, sLz: 0.08, sRx: 0.1, sRz: -0.08, eL: 0.3, eR: 0.3, lL: 1.57, lR: 1.57, kL: -1.57, kR: -1.57, labY: 1.62 };
  let px = a.sx, py = a.fy, pz = a.sz, yaw = a.face, bob = 0, snap = false;
  if (!w && st === "stretching") {
    const sp = 0.85 + hash(a.seed) * 0.35, c = (t * sp + ph * 1.7) % 9;
    px = a.stretchAt.x; pz = a.stretchAt.z; yaw = Math.PI;
    if (/(ground|bottom) floor|together/i.test(a.task || "")) { px = a.groupAt.x; pz = a.groupAt.z; py = 0; }
    Object.assign(tg, { hipY: 0.9, lL: 0, lR: 0, kL: 0, kR: 0, labY: 2.05 });
    if (c < 6.2) { const bend = Math.sin(c / 6.2 * Math.PI * 2) * 0.3;
      Object.assign(tg, { tZ: bend, hZ: bend * 0.4, hX: 0.15, sLx: 2.9, sLz: -0.15, sRx: 2.9, sRz: 0.15, eL: 0.15, eR: 0.15 }); }
    else { const r = (c - 6.2) * 4.5;
      Object.assign(tg, { tX: 0.04, hX: 0.05, sLx: 0.12 + Math.sin(r) * 0.3, sLz: 0.18 + Math.cos(r) * 0.12, sRx: 0.12 + Math.sin(r) * 0.3, sRz: -0.18 - Math.cos(r) * 0.12, eL: 0.2, eR: 0.2 });
      bob = Math.max(0, Math.sin(r)) * 0.02; }
  } else if (!w) {
    if (st === "working") {
      const k = t * 14 + ph * 3;
      Object.assign(tg, { tX: -0.12, hX: -0.12, sLx: 0.62, sLz: 0.1, sRx: 0.62, sRz: -0.1, eL: 1.05 + Math.max(0, Math.sin(k)) * 0.22, eR: 1.05 + Math.max(0, Math.sin(k + 2.1)) * 0.22 });
    } else if (st === "thinking") {
      Object.assign(tg, { tX: -0.04, hX: 0.05, hZ: Math.sin(t * 0.9 + ph) * 0.2, sLx: 0.5, sLz: 0.1, eL: 0.9, sRx: 0.55, sRz: -0.45, eR: 2.35 + Math.sin(t * 2 + ph) * 0.05 });
      bubbleOn = true;
    } else {
      const sip = ((t + ph) % 7) < 1.8;
      Object.assign(tg, { tX: 0.22, hX: sip ? 0.15 : 0.05, sLx: 0.15, sLz: 0.12, eL: 0.35, sRx: sip ? 0.75 : 0.45, sRz: -0.2, eR: sip ? 2.25 : 1.55 }); mugOn = true;
      if (Math.random() < dt * 4) { P.mug.getWorldPosition(tmpV); tmpV.y += 0.08; puff(tmpV); }
    }
  } else {
    snap = true; px = w.x; py = w.y; pz = w.z; yaw = w.yaw ?? a.face;
    const g = w.phase === "give";
    Object.assign(tg, { hipY: 0.9, lL: 0, lR: 0, kL: 0, kR: 0, labY: 2.05 });
    if (g) { const tb = byId[w.to]; yaw = Math.atan2(-(tb.sx - px), -(tb.sz - pz)); Object.assign(tg, { sLx: 1.25, sLz: 0.2, sRx: 1.25, sRz: -0.2, eL: 0.3, eR: 0.3 }); }
    if (w.moving) {
      const s = w.walkT * 9;
      tg.lL = Math.sin(s) * 0.55; tg.lR = -Math.sin(s) * 0.55; tg.kL = -Math.max(0, Math.sin(s + 1.2)) * 0.8; tg.kR = -Math.max(0, -Math.sin(s + 1.2)) * 0.8;
      bob = Math.abs(Math.sin(s)) * 0.035;
      if (w.phase === "go") Object.assign(tg, { sLx: 0.75, sLz: 0.3, sRx: 0.75, sRz: -0.3, eL: 1.0, eR: 1.0 });
      else Object.assign(tg, { sLx: -Math.sin(s) * 0.45, sRx: Math.sin(s) * 0.45, eL: 0.3, eR: 0.3 });
    }
    folderOn = w.phase === "go" || (g && w.giveT < 0.2);
    if (g && w.giveT >= 0.2 && w.giveT < 1.1) {
      const tb = byId[w.to], k = (w.giveT - 0.2) / 0.9;
      P.folder.getWorldPosition(tmpV); tb.deskFolder.getWorldPosition(endV);
      fly.visible = true; fly.position.lerpVectors(tmpV, endV, k); fly.position.y += Math.sin(k * Math.PI) * 0.15; fly.rotation.set(-Math.PI / 2 * k, 0.3 * k, 0);
      w._fly = true;
    } else if (w._fly) { fly.visible = false; w._fly = false; }
    P.check.visible = g && w.giveT > 1.0;
    if (P.check.visible) P.check.position.set(0, 2.0 + (w.giveT - 1.0) * 0.4, 0);
  }
  if (!w) P.check.visible = false;
  for (const key in tg) P.pose[key] = damp(P.pose[key] ?? tg[key], tg[key], key[0] === "e" || key[0] === "s" ? 12 : 9, dt);
  const p = P.pose;
  if (snap) P.root.position.set(px, py, pz);
  else { P.root.position.x = damp(P.root.position.x, px, 8, dt); P.root.position.z = damp(P.root.position.z, pz, 8, dt); P.root.position.y = py; }
  a.yaw = angDamp(a.yaw, yaw, 10, dt); P.root.rotation.y = a.yaw;
  P.hips.position.y = p.hipY + bob;
  P.torso.rotation.set(p.tX, 0, p.tZ); P.head.rotation.set(p.hX, 0, p.hZ);
  P.armL.sh.rotation.set(p.sLx, 0, p.sLz); P.armR.sh.rotation.set(p.sRx, 0, p.sRz);
  P.armL.el.rotation.x = p.eL; P.armR.el.rotation.x = p.eR;
  P.legL.hp.rotation.x = p.lL; P.legR.hp.rotation.x = p.lR; P.legL.kn.rotation.x = p.kL; P.legR.kn.rotation.x = p.kR;
  const below = a.floor === 0 && a.row === 1 && !w && st !== "stretching";   // ground front row: label hangs below the chair
  P.lab.center.set(0.5, below ? 0 : 1);
  P.lab.position.y = below ? 0.02 : p.labY + (a.row === 1 ? 0 : 0.3);
  P.mug.visible = mugOn; a.deskMug.visible = !mugOn;
  P.folder.visible = folderOn;
  a.deskFolder.visible = nowS() < a.folderUntil;
  a.chairBack.rotation.x = damp(a.chairBack.rotation.x, !w && st === "idle" ? 0.22 : 0, 6, dt);
  P.bubble.visible = bubbleOn;
  if (bubbleOn) { const cyc = (t + ph) % 6; P.bubble.material.map = cyc < 4 ? BUBBLE[Math.floor(t * 3) % 3] : BUBBLE[3]; P.bubble.position.y = 1.72 + Math.sin(t * 2 + ph) * 0.04; }
  const away = !!w || st === "stretching";
  a.scrM.color.setScalar(away ? 0.6 : st === "working" ? 0.85 + 0.15 * Math.sin(t * 6 + ph) : st === "idle" ? 0.8 : 0.9);
  a.glow.material.opacity = away ? 0.03 : st === "working" ? 0.10 + 0.07 * Math.sin(t * 6 + ph) : 0.06;
}

/* ---------- loop ---------- */
let last = nowS(), lastScreens = 0, lastSky = -9, lastClock = -99;
function frame() {
  const t = nowS(), dt = Math.min(0.05, t - last); last = t;
  O.tick(); startQueued(); walkers.slice().forEach(w => stepWalker(w, dt));
  AGENTS.forEach(a => poseAgent(a, t, dt));
  if (t - lastScreens > 0.25) { AGENTS.forEach(a => screenDraw(a, t)); lastScreens = t; }
  if (t - lastSky > 0.5) {
    const hour = jakartaHour(), s = skyFor(hour);
    windows.forEach(w => drawSky(w, t, hour));
    hemi.color.set(s.hemi); key.color.set(s.key); key.intensity = s.ki;
    lastSky = t;
  }
  if (t - lastClock > 10) { drawClock(); lastClock = t; }
  if (Math.random() < dt * 5) { tmpV.copy(steamSources[0].off).applyMatrix4(steamSources[0].obj.matrixWorld); puff(tmpV); }
  steam.forEach(p => { if (!p.s.visible) return; p.life += dt; const k = p.life / p.max;
    if (k >= 1) { p.s.visible = false; return; }
    p.s.position.y += dt * 0.28; p.s.position.x += p.vx * dt; p.s.material.opacity = 0.55 * (1 - k); p.s.scale.setScalar(0.08 + k * 0.14); });
  sway.forEach(s => { s.leaves.rotation.z = Math.sin(t * 0.9 + s.ph) * 0.04; });
  coffee.userData.led.material.color.set(Math.floor(t * 2) % 2 ? "#30D158" : "#1E7D3A");
  if (t - lastInteract > 6) {           // gentle auto-drift when nobody is dragging
    sph.setFromVector3(tmpV.copy(camera.position).sub(controls.target));
    sph.theta += driftDir * 0.02 * dt;
    if (sph.theta > 0.2) driftDir = -1; if (sph.theta < -0.12) driftDir = 1;
    camera.position.setFromSpherical(sph).add(controls.target);
  }
  controls.update();
  renderer.render(scene, camera);
  labelR.render(scene, camera);
  requestAnimationFrame(frame);
}
drawClock();
requestAnimationFrame(frame);
window.__three = { renderer, scene, camera };
</script>
